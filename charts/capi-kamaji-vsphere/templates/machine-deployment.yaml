{{- range .Values.nodePools }}
{{- $autoscaling := .autoscaling | default dict }}
---
kind: MachineDeployment
apiVersion: cluster.x-k8s.io/v1beta1
metadata:
  {{- if $autoscaling.enabled }}
  annotations:
    cluster.x-k8s.io/cluster-api-autoscaler-node-group-min-size: {{ $autoscaling.minSize | quote }}
    cluster.x-k8s.io/cluster-api-autoscaler-node-group-max-size: {{ $autoscaling.maxSize | quote }}
  {{- end }}
  labels:
    cluster.x-k8s.io/cluster-name: {{ include "cluster-api-kamaji-vsphere.cluster-name" $ | quote }}
  name: {{ include "cluster-api-kamaji-vsphere.cluster-name" $ }}-{{ .name }}-md
  namespace: {{ $.Release.Namespace }}
spec:
  clusterName: {{ include "cluster-api-kamaji-vsphere.cluster-name" $ | quote }}
  {{- /*
  With autoscaling, replicas is left unset so Helm doesn't compete with the Cluster
  Autoscaler for the field. If it were rendered, Helm 4 upgrades would fail with a
  server-side apply conflict on .spec.replicas once the autoscaler has scaled the pool
  (or reset the count with --force-conflicts), and Helm 3 would overwrite the count
  whenever the replicas value changes. Cluster API defaults it from the min/max-size
  annotations instead (min-size on create, current value clamped on update).
  */}}
  {{- if not $autoscaling.enabled }}
  replicas: {{ .replicas }}
  {{- end }}
  selector:
    matchLabels: {}
  template:
    metadata:
      labels:
        cluster.x-k8s.io/cluster-name: {{ include "cluster-api-kamaji-vsphere.cluster-name" $ | quote }}
    spec:
      bootstrap:
        configRef:
          apiVersion: bootstrap.cluster.x-k8s.io/v1beta1
          kind: KubeadmConfigTemplate
          name: {{ include "cluster-api-kamaji-vsphere.cluster-name" $ }}-{{ .name }}-kubeadmconfig-{{ include "kubeadmConfigTemplateHash" (dict "nodePool" .) }}
      clusterName: {{ include "cluster-api-kamaji-vsphere.cluster-name" $ | quote }}
      infrastructureRef:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
        kind: VSphereMachineTemplate
        name: {{ include "cluster-api-kamaji-vsphere.cluster-name" $ }}-{{ .name }}-vsphere-machine-template-{{ include "vSphereMachineTemplateHash" (dict "nodePool" . "Global" $) }}
      version: {{ $.Values.cluster.controlPlane.version | quote }}
{{- end }}