name: capi-kamaji-vsphere
version: 0.3.0
appVersion: 1.32.0
description: A Helm chart for deploying a Kamaji Tenant Cluster on vSphere using Cluster API
  and Kamaji.
icon: https://raw.githubusercontent.com/kubernetes/cloud-provider-vsphere/master/docs/vmware_logo.png
type: application
apiVersion: v2
maintainers:
  - name: Clastix Labs
    email: authors@clastix.labs
keywords:
  - kubernetes
  - cluster-api
  - kamaji
  - vsphere
home: https://kamaji.clastix.io
sources:
  - https://github.com/clastix/cluster-api-kamaji-vsphere
annotations:
  artifacthub.io/links: |
    - name: Clastix Labs
      url: https://github.com/clastix
  artifacthub.io/operator: "true"
  artifacthub.io/operatorCapabilities: "Full Lifecycle"
  artifacthub.io/changes: |
    - kind: fixed
      description: Node pools with autoscaling enabled no longer set replicas on the MachineDeployment, so Helm upgrades don't conflict with the Cluster Autoscaler or override its node count
    - kind: added
      description: Cluster Autoscaler capacity annotations (cpu, memory, ephemeral-disk, labels, taints) on autoscaled node pools, derived from the node pool values, to enable scaling from zero
    - kind: added
      description: nodePools[].autoscaling.labels to label the MachineDeployment so the Cluster Autoscaler auto-discovery can select it
